      const toggles = window.document.querySelectorAll('.quarto-color-scheme-toggle');

        disableStylesheet(alternateStylesheets);

    const disableStylesheet = (stylesheets) => {
      for (let i=0; i < stylesheets.length; i++) {

          stylesheet.rel = 'stylesheet';

    }
    const manageTransitions = (selector, allowTransitions) => {
      const els = window.document.querySelectorAll(selector);
      for (let i=0; i < els.length; i++) {
        const el = els[i];

    const isFileUrl = () => {

      }
    }
    const setStyleSentinel = (alternate) => {

      } else {

      }
    }
    const toggleGiscusIfUsed = (isAlternate, darkModeDefault) => {
      const baseTheme = document.querySelector('#giscus-base-theme')?.value ?? 'light';

      let newTheme = '';

<script>
(function () {
  var WARES = [
    { id:'colemak', cat:'Arma · Legendaria', glyph:'\u2328', costo:60, name:'La Disposición Colemak-DH', real:'Cambiar de QWERTY a Colemak-DH', tip:'QWERTY nació para máquinas de escribir, no para tus dedos. Colemak-DH mantiene las letras frecuentes en la fila base: las manos viajan mucho menos y la fatiga cae. La curva es de semanas, pero el alivio es para siempre.' },
    { id:'split', cat:'Armadura · Pesada', glyph:'\u2453', costo:55, name:'El Teclado Partido', real:'Teclado split / columnar', tip:'Un teclado dividido deja que tus hombros se abran y tus muñecas queden rectas, sin la torsión que impone un teclado plano. Tu postura deja de pelear contra la geometría.' },
    { id:'modal', cat:'Arma · Ágil', glyph:'\u2756', costo:45, name:'La Edición Modal', real:'Vim / movimiento por teclado', tip:'Cada viaje al ratón es un microdesgaste del hombro. Moverte y editar sin salir de la fila base mantiene las manos quietas y el pensamiento fluido. Empieza por los movimientos; lo demás llega solo.' },
    { id:'tiling', cat:'Reliquia · Arcana', glyph:'\u25f0', costo:40, name:'El Gestor de Mosaicos', real:'Tiling WM / atajos de ventanas', tip:'Ordenar ventanas con el teclado en lugar de arrastrarlas ahorra cientos de gestos finos al día. Menos ratón, menos tensión en la muñeca, más foco.' },
    { id:'reposa', cat:'Armadura · Ligera', glyph:'\u2334', costo:25, name:'El Reposamuñecas', real:'Soporte de muñeca neutro', tip:'La muñeca debe flotar recta, no doblarse sobre el borde de la mesa. Un soporte que mantenga el ángulo neutro evita la compresión del nervio mediano — la raíz del túnel carpiano.' },
    { id:'pie', cat:'Armadura · Encantada', glyph:'\u2191', costo:50, name:'El Escritorio Erguido', real:'Escritorio de pie / alternar postura', tip:'El cuerpo no fue hecho para una sola postura durante horas. Alternar entre sentado y de pie cada media hora reactiva la circulación y descarga la espalda baja.' },
    { id:'flux', cat:'Talismán · Nocturno', glyph:'\u263E', costo:20, name:'El Talismán Ámbar', real:'Filtro de luz cálida (f.lux / Night Shift)', tip:'Al caer la tarde, la luz azul de la pantalla espanta el sueño. Un filtro que entibie los tonos protege tu descanso — y un buen descanso es la mitad del estudio.' },
    { id:'pomodoro', cat:'Talismán · Temporal', glyph:'\u25d4', costo:15, name:'El Reloj de Arena', real:'Técnica Pomodoro (25 + 5)', tip:'Trabaja 25 minutos, descansa 5. El límite no te frena: te protege de las sesiones interminables que arruinan muñecas, ojos y atención. Cada pausa es una visita breve a la hoguera.' }
  ];

  function rutas(){ return (window.DESCUBRIMIENTOS && window.DESCUBRIMIENTOS.rutas) || {}; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function catColor(cat){
    if (cat.indexOf('Arma')===0) return '#E0A86A';
    if (cat.indexOf('Armadura')===0) return '#8FB0C9';
    if (cat.indexOf('Talismán')===0) return '#C9A0D4';
    return '#A9C58E';
  }
  function flash(msg){
    var el=document.createElement('div'); el.textContent=msg;
    el.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:99999;background:#3A2616;color:#E89B7A;border:1px solid #E89B7A;border-radius:8px;padding:10px 18px;font-family:monospace;font-size:12px;';
    document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 1600);
  }

  function render() {
    var root = document.getElementById('com');
    if (!root || !window.FisicaSave) return;
    var claseReal = window.FisicaSave.getClase();
    var temas = window.TEMAS_DESCANSO || {};
    var T = (temas[claseReal] || {}).comerciante;
    if (T) { renderThemed(T, claseReal); } else { renderDefault(); }
  }

  function renderDefault() {
    var root = document.getElementById('com');
    if (!root || !window.FisicaSave) return;
    var rt = rutas(); var clase = window.FisicaSave.getClase(); if(!clase||!rt[clase]) clase='mercury';
    var R = rt[clase] || { name:'El Mensajero', glyph:'\u263F', color:'#A8780C', tint:'#F6ECD4', deep:'#6F4E08' };
    var saldo = window.FisicaSave.esquirlas();
    var inv = window.FisicaSave.inventario();

    var h = '<div class="wrap">';
    h += '<div style="text-align:center;"><p class="c-mono" style="font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9A8F77;margin:0 0 16px;">Física Computacional · Algunos Tips</p>'
       + '<h1 style="font-family:Newsreader,serif;font-weight:500;font-size:42px;color:#F4ECDA;margin:0 0 12px;letter-spacing:-.01em;">Consejos útiles</h1>'
       + '<p style="font-family:Newsreader,serif;font-style:italic;font-size:17px;line-height:1.55;color:#BCB199;max-width:560px;margin:0 auto;">«Sé bienvenido. Lo que encuentres aquí está pensado para ayudarte. Cada recuadro ahorra a tu cuerpo un poco del desgaste del estudio.»</p></div>';
    // bolsa
    h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(237,230,214,.14);border-bottom:1px solid rgba(237,230,214,.14);padding:16px 4px;margin:28px 0 26px;">'
       + '<span style="display:inline-flex;align-items:center;gap:9px;"><span style="width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:'+R.tint+';border:1.5px solid '+R.color+';color:'+R.deep+';font-size:15px;">'+R.glyph+'</span>'
       + '<span class="c-mono" style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A8F77;">Ruta · '+esc(R.name)+'</span></span>'
       + '<span style="display:inline-flex;align-items:center;gap:10px;"><span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#F4D483,#D9A227);color:#5A3E08;font-size:14px;box-shadow:0 0 14px rgba(217,162,39,.4);">◈</span>'
       + '<span style="font-family:Newsreader,serif;font-size:22px;color:#F4ECDA;"><span style="color:#F4D483;font-weight:500;">'+saldo+'</span> esquirlas</span></span></div>';
    // rejilla
    h += '<div class="c-grid">';
    WARES.forEach(function(w){
      var owned = !!inv[w.id]; var afford = saldo>=w.costo; var cc = catColor(w.cat);
      h += '<div style="display:flex;flex-direction:column;background:'+(owned?'rgba(140,165,110,.10)':'rgba(237,230,214,.035)')+';border:'+(owned?'1px solid rgba(160,190,120,.45)':'1px solid rgba(237,230,214,.13)')+';border-radius:10px;padding:20px 22px;">'
         + '<div style="display:flex;align-items:flex-start;gap:14px;"><span style="flex:0 0 auto;width:50px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;background:'+(owned?'rgba(160,190,120,.16)':'rgba(237,230,214,.06)')+';border:'+(owned?'1px solid rgba(160,190,120,.5)':'1px solid rgba(237,230,214,.16)')+';color:'+(owned?'#AFC98A':cc)+';">'+w.glyph+'</span>'
         + '<span style="flex:1;min-width:0;"><span class="c-mono" style="display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:'+cc+';margin-bottom:4px;">'+esc(w.cat)+'</span>'
         + '<span style="display:block;font-family:Newsreader,serif;font-size:20px;font-weight:500;line-height:1.18;color:#F4ECDA;">'+esc(w.name)+'</span>'
         + '<span style="display:block;font-family:Newsreader,serif;font-style:italic;font-size:13.5px;color:'+(owned?'#A9C58E':'#9A8F77')+';margin-top:2px;">'+esc(w.real)+'</span></span></div>'
         + '<p style="font-family:Newsreader,serif;font-size:14.5px;line-height:1.62;color:#C4B89E;margin:13px 0 16px;flex:1;">'+esc(w.tip)+'</p>'
         + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><span style="display:inline-flex;align-items:center;gap:6px;font-family:Newsreader,serif;font-size:17px;color:'+(owned?'#8A8068':'#EDE6D6')+';"><span style="font-size:13px;color:#D9A227;">◈</span>'+w.costo+'</span>';
      if (owned) {
        h += '<button class="c-buy" disabled style="color:#AFC98A;background:transparent;border:1px solid rgba(160,190,120,.5);cursor:default;">✓ En tu equipo</button>';
      } else {
        h += '<button class="c-buy" data-id="'+w.id+'" data-costo="'+w.costo+'" style="color:'+(afford?'#5A3E08':'#8A8068')+';background:'+(afford?'linear-gradient(180deg,#F4D483,#D9A227)':'transparent')+';border:'+(afford?'none':'1px solid rgba(237,230,214,.2)')+';cursor:'+(afford?'pointer':'not-allowed')+';">'+(afford?'Adquirir':'Sin fondos')+'</button>';
      }

      var newHref = href.replace(".html", "-" + lang + ".html");
      a.setAttribute("href", newHref);

      a.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        // La Hoguera / El Comerciante / Evento pueden interceptar la
        // navegación aquí (ver ventanas-emergentes.js). Si intentar()
        // devuelve true ya se mostró una ventana y no navegamos.
        if (window.VentanasEmergentes && window.VentanasEmergentes.intentar(newHref)) return;
        window.location.href = newHref;
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", rewriteLinks);
  } else {
    rewriteLinks();
  }
})();
</script>
