<script>
(function () {
  var bt = null, st = null;
  var S = {
    breathRun:false, bPhase:0, bSecs:4, bCycle:0,
    stState:'idle', stIdx:0, stSecs:0
  };
  var BREATH = [
    { name:'Inhala', dur:4, scale:1.0 }, { name:'Sostén', dur:4, scale:1.0 },
    { name:'Exhala', dur:4, scale:0.56 }, { name:'Sostén', dur:4, scale:0.56 }
  ];
  var STRETCH = [
    { name:'Muñeca en extensión', hold:20, instr:'Brazo extendido al frente, palma como “alto”. Con la otra mano tira los dedos suavemente hacia ti. Cambia de mano a la mitad.' },
    { name:'Muñeca en flexión', hold:20, instr:'Brazo extendido, palma hacia ti. Lleva los dedos hacia el cuerpo con la otra mano, sin forzar. Cambia de mano a la mitad.' },
    { name:'Oración inversa', hold:20, instr:'Junta las palmas frente al pecho y baja las manos lentamente, manteniéndolas unidas, hasta sentir un estiramiento suave.' },
    { name:'Abrir y cerrar', hold:15, instr:'Abre los dedos al máximo y luego cierra el puño, despacio. Repite el ciclo durante todo el conteo.' },
    { name:'Cuello lateral', hold:20, instr:'Lleva la oreja hacia el hombro, deja caer el peso de la cabeza. Cambia de lado a la mitad. Hombros sueltos.' },
    { name:'Rodar los hombros', hold:15, instr:'Rueda ambos hombros hacia atrás en círculos amplios y lentos durante todo el conteo. Suelta la mandíbula.' }
  ];

  function rutas(){ return (window.DESCUBRIMIENTOS && window.DESCUBRIMIENTOS.rutas) || {}; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Despacha al reskin temático (temas-descanso.js) cuando exista uno para la
  // ruta activa; Racket (y cualquier lenguaje sin reskin propio todavía) usa
  // el diseño original de abajo tal cual, sin recolorear.
  function render() {
    var root = document.getElementById('hog');
    if (!root || !window.FisicaSave) return;
    var claseReal = window.FisicaSave.getClase();
    var temas = window.TEMAS_DESCANSO || {};
    var T = (temas[claseReal] || {}).hoguera;
    if (T) { renderThemed(T, claseReal); } else { renderDefault(); }
  }

  function renderDefault() {
    var root = document.getElementById('hog');
    if (!root || !window.FisicaSave) return;
    var rt = rutas(); var clase = window.FisicaSave.getClase(); if(!clase||!rt[clase]) clase='mercury';
    var R = rt[clase] || { name:'El Mensajero', glyph:'\u263F', color:'#A8780C', tint:'#F6ECD4', deep:'#6F4E08' };
    root.style.setProperty('--h-color', R.color); root.style.setProperty('--h-tint', R.tint); root.style.setProperty('--h-deep', R.deep);

    var B = BREATH[S.bPhase];
    var flame = S.breathRun ? (110 + 74 * B.scale) : 150;
    var cur = STRETCH[S.stIdx] || STRETCH[0];
    var active = S.stState==='active', done = S.stState==='done', idle = S.stState==='idle';

    var desc = window.FisicaSave.descansos();
    var ult = window.FisicaSave.ultimaHoguera();
    var hh = ult ? ('0'+new Date(ult).getHours()).slice(-2)+':'+('0'+new Date(ult).getMinutes()).slice(-2) : '';
    var restStatus = desc>0 ? ('Has descansado '+desc+(desc===1?' vez':' veces')+'. Tu progreso está a salvo'+(hh?' · última hoguera '+hh:'')+'.')
                            : 'Tu progreso ya está a salvo. Vuelve cuando lo necesites.';

    var h = '<div class="wrap">';
    // header
    h += '<div class="h-row" style="margin-bottom:30px;">'
       + '<span style="display:inline-flex;align-items:center;gap:9px;"><span style="width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:'+R.tint+';border:1.5px solid '+R.color+';color:'+R.deep+';font-size:15px;">'+R.glyph+'</span>'
       + '<span class="h-mono" style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#B7A98C;">Ruta · '+esc(R.name)+'</span></span></div>';
    // hero + flame
    h += '<div style="text-align:center;position:relative;"><div style="position:relative;width:200px;height:200px;margin:0 auto 8px;">'
       + '<div class="h-ember" style="position:absolute;left:46%;bottom:60px;width:4px;height:4px;border-radius:50%;background:#F4C46B;"></div>'
       + '<div class="h-ember" style="position:absolute;left:54%;bottom:54px;width:3px;height:3px;border-radius:50%;background:#E8A33D;animation-delay:1.6s;"></div>'
       + '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">'
       + '<div style="width:'+flame.toFixed(0)+'px;height:'+flame.toFixed(0)+'px;border-radius:50%;background:radial-gradient(circle,#FBE3A8 0%,#F4C46B 26%,#E8A33D 46%,rgba(232,163,61,.22) 70%,transparent 76%);box-shadow:0 0 90px 10px rgba(232,163,61,.4);transition:width '+(S.breathRun?B.dur:0.6)+'s ease-in-out,height '+(S.breathRun?B.dur:0.6)+'s ease-in-out;display:flex;align-items:center;justify-content:center;">'
       + '<div style="text-align:center;"><div class="h-mono" style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5A3410;">'+(S.breathRun?B.name:'Pulsa')+'</div>'
       + '<div style="font-family:Newsreader,serif;font-size:34px;font-weight:500;color:#3A2008;line-height:1;margin-top:2px;">'+(S.breathRun?S.bSecs:'4')+'</div></div></div></div></div>'
       + '<h1 style="font-family:Newsreader,serif;font-weight:500;font-size:40px;color:#F6ECD9;margin:6px 0 10px;letter-spacing:-.01em;">Pausa</h1>'
       + '<p style="font-family:Newsreader,serif;font-style:italic;font-size:17px;line-height:1.55;color:#C9BCA0;max-width:500px;margin:0 auto;">Deja el cálculo. Levántate. Este sitio guarda tu avance mientras descansas: nada de lo estudiado se pierde.</p></div>';
    // respira
    h += '<div class="h-sec"><div class="h-row" style="align-items:baseline;"><h2 class="h-h2">Respira</h2>'
       + '<span class="h-mono" style="font-size:10.5px;color:#9C8F76;">Respiración en caja · 4·4·4·4 · ciclo '+S.bCycle+'</span></div>'
       + '<p style="font-family:Newsreader,serif;font-style:italic;font-size:15px;line-height:1.6;color:#C2B498;margin:8px 0 16px;max-width:560px;">Sigue el conteo: inicia al inhalar, se sostiene, mengua al exhalar. Cuatro ciclos serenan el pulso antes de volver.</p>'
       + '<button class="h-btn" id="h-breath">'+(S.breathRun?'Detener':'Comenzar a respirar')+'</button></div>';
    // estira
    h += '<div class="h-sec"><div class="h-row" style="align-items:baseline;"><h2 class="h-h2">Estira</h2>'
       + '<span class="h-mono" style="font-size:10.5px;color:#9C8F76;">Rutina anti-túnel carpiano · '+(active?(S.stIdx+1)+' / '+STRETCH.length:(done?'completa':STRETCH.length+' estiramientos'))+'</span></div>';
    if (active) {
      h += '<div style="background:rgba(239,227,206,.05);border:1px solid rgba(239,227,206,.16);border-radius:12px;padding:22px 24px;margin-top:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;">'
         + '<div style="flex:0 0 auto;width:84px;height:84px;border-radius:50%;border:2px solid #E8A33D;display:flex;align-items:center;justify-content:center;"><span style="font-family:Newsreader,serif;font-size:30px;color:#F4C46B;">'+S.stSecs+'</span></div>'

              if (div === null) {
                div = window.document.createElement("div");
                div.setAttribute("id", "code-annotation-line-highlight");
                div.style.position = 'absolute';
                parent.appendChild(div);
              }
              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>

<script>
(function () {
  var STORAGE_KEY = "selectedLang";
  var LANGS = ["racket", "haskell", "idris", "agda", "ats", "mercury", "lean"];

  window.setLang = function (chosen) {
    localStorage.setItem(STORAGE_KEY, chosen);
    window.location.href = "bienvenido-" + chosen + ".html";
  };

  var lang = localStorage.getItem(STORAGE_KEY);
  if (!lang || LANGS.indexOf(lang) === -1) return;

  // Aplicar tema de color
  document.documentElement.setAttribute("data-lang", lang);

  // Reescribir enlaces lang-link
  function rewriteLinks() {
    document.querySelectorAll("a.lang-link").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href || href.startsWith("#")) return;

      LANGS.forEach(function (l) {
        href = href.replace("-" + l + ".html", ".html");
      });

      var newHref = href.replace(".html", "-" + lang + ".html");
      a.setAttribute("href", newHref);

      a.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        // La Hoguera / El Comerciante / Evento pueden interceptar la
        // navegación aquí (ver ventanas-emergentes.js). Si intentar()
        // devuelve true ya se mostró una ventana y no navegamos.
        if (window.VentanasEmergentes && window.VentanasEmergentes.intentar(newHref)) return;
        window.location.href = newHref;
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", rewriteLinks);
  } else {
    rewriteLinks();
  }
})();
</script>
